name: Probe changelog artifacts

on:
  pull_request:
    paths:
      - '.github/workflows/probe-changelog-artifacts.yml'

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg:
          - { dir: packages/react, slug: react }
          - { dir: packages/vue, slug: vue }
    steps:
      - uses: actions/checkout@v7

      - name: Write changelog and notes
        shell: bash
        run: |
          set -euo pipefail
          printf '\n## probe %s\n' "${{ matrix.pkg.slug }}" >> "${{ matrix.pkg.dir }}/CHANGELOG.md"
          printf 'notes for %s\n' "${{ matrix.pkg.slug }}" > .release-notes.md

      - name: Prepare changelog artifact (preserve paths)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ".release-artifacts/${{ matrix.pkg.dir }}"
          cp "${{ matrix.pkg.dir }}/CHANGELOG.md" ".release-artifacts/${{ matrix.pkg.dir }}/CHANGELOG.md"

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v6
        with:
          name: probe-changelog-${{ matrix.pkg.slug }}
          path: .release-artifacts
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v6
        with:
          name: probe-release-notes-${{ matrix.pkg.slug }}
          path: .release-notes.md
          include-hidden-files: true
          if-no-files-found: error

  download:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download changelog artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: probe-changelog-*
          merge-multiple: true

      - name: Check the working tree
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain
          git diff -- 'packages/*/CHANGELOG.md' | tail -n 20
          test "$(git status --porcelain -- 'packages/*/CHANGELOG.md' | wc -l)" -eq 2
